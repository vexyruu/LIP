name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: Test
        run: |
          go test ./shared/go/...
          go test ./services/listing-service/...
          go test ./services/fraud-service/...
          go test ./services/analysis-worker/...
          go test ./services/fraud-batch-job/...

      - name: Vet
        run: |
          go vet ./shared/go/...
          go vet ./services/listing-service/...
          go vet ./services/fraud-service/...
          go vet ./services/analysis-worker/...
          go vet ./services/fraud-batch-job/...

  python:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ml-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure spaCy English model
        run: python -m spacy download en_core_web_sm

      - name: Test
        run: pytest tests/ -v

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/moderation-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/moderation-dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  listing-lab:
    name: Listing Lab build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/listing-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/listing-lab/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
